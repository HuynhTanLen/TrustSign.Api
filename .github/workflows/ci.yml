name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TrustSign.slnx
      - run: dotnet build TrustSign.slnx --no-restore --configuration Release
      - run: dotnet test TrustSign.slnx --no-build --configuration Release
